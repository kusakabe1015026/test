name: Auto cherry-pick

on:
  # mainへのmerge完了を入口にする。closedだけでは未mergeのPRも発火するため、
  # job 側で merged == true を確認する。
  pull_request:
    types:
      - closed
    branches:
      - main

  workflow_dispatch:
    inputs:
      pr_number:
        # Versionラベル付与がmerge後になった場合や、失敗後の再実行に使う。
        description: "処理対象のPR番号"
        required: true
        type: string

concurrency:
  # 同じ対象ブランチを複数のActionsが同時に書き換えると、pushの競合や
  # 二重反映が起きるため、リポジトリ単位で待ち合わせる。
  group: ${{ github.repository }}-auto-cherry-pick
  cancel-in-progress: false

jobs:
  auto-cherry-pick:
    # workflow_dispatchは明示的な再実行なので無条件で通し、PRイベントではmerge済みだけ通す。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GITHUB_TOKENの権限制限に依存せず、対象ブランチへの直接pushと
          # workflowファイルを含む変更のpushを可能にするため、SSO済みPATを使う。
          token: ${{ secrets.AUTO_CHERRY_PICK_ACTIONS_TOKEN }}
          persist-credentials: true

      - name: Run auto cherry-pick
        env:
          # API経由でのPR取得、コメント投稿はGITHUB_TOKENを使う。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
        run: |
          # 複数ラベルの結果をPythonが集計し、1件でも失敗した場合はworkflowも失敗させる。
          set -eux

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 900_Scripts/auto_cherry_pick/auto_cherry_pick.py \
            --pr-number "$PR_NUMBER"
