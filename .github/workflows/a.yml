name: Test Japanese Argument

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Japanese argument
        shell: pwsh
        run: |
          $arg = "日本語テスト・開発資料・あいうえお"
          .\a.exe "$arg"

      - name: Find temporary PowerShell scripts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem $env:RUNNER_TEMP -Filter "*.ps1" -Recurse |
            Select-Object FullName, Length

      - name: Upload temporary scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-ps1
          path: ${{ runner.temp }}/**/*.ps1
          if-no-files-found: warn